<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация — Реклама+</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Advent+Pro:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="style/register.css">
</head>
<body>
    <div class="header">
        <div class="logo"><img src="images/Лого.png" alt="Реклама+"></div>
        <div class="nav-menu">
            <a href="index.html#about">Об агентстве</a>
            <a href="index.html#services">Услуги</a>
            <a href="index.html#cases">Кейсы</a>
            <a href="index.html#contacts">Контакты</a>
            <a href="cabinet.html">Личный кабинет</a>
        </div>
        <div class="header-right"></div>
    </div>

    <div class="main-content">
        <div class="register-container">
            <div class="register-title">Регистрация</div>
            <form id="registerForm">
                <input type="text" class="register-input" placeholder="Логин" required>
                <input type="password" class="register-input" placeholder="Пароль" required>
                <input type="email" class="register-input" placeholder="Электронная почта" required>
                <input type="tel" class="register-input" placeholder="Номер телефона" required>
                <button type="submit" class="register-btn">Зарегистрироваться</button>
            </form>
            <div class="login-link">
                Уже есть аккаунт? <a href="login.html">Войти</a>
            </div>
        </div>
    </div>

    <div class="footer">
        г. Санкт-Петербург, ул. Садовая, 23<br>
        © 2002 Реклама + Все права защищены
    </div>

    <div class="modal fade" id="successModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <div class="modal-title">Успешно!</div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    Регистрация прошла успешно!<br>
                    Войдите в личный кабинет.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-custom" data-bs-dismiss="modal">Закрыть</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script/auth.js"></script>
</body>
</html>
